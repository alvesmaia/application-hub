# Hub stack. Project/container/volume/network/image names, port and network range are configurable
# (defaults = original installation): HUB_PROJECT (app-hub), HUB_PORT (8090), HUB_BIND (127.0.0.1),
# HUB_SUBNET (10.231 → app networks 10.231.<n>.0/24). Two instances on the same host = distinct HUB_PROJECT, HUB_PORT and
# HUB_SUBNET values (see scripts/install.sh). Sample apps: docker-compose.apps.yml + `demo-apps` profile.
name: ${HUB_PROJECT:-app-hub}

services:
  app-hub-web:
    image: ${HUB_PROJECT:-app-hub}-web
    build:
      context: ..
      dockerfile: platform-py/Dockerfile
      args:
        MC_IMAGE: ${HUB_MC_IMAGE:-app-hub-mc:0.10.0} # build first: scripts/install.sh (or infra/minio/Dockerfile, mc target)
    container_name: ${HUB_PROJECT:-app-hub}-web
    labels: { hub.py: "1" }
    mem_limit: 1g # backups and restores load the package into memory (1 GiB)
    restart: unless-stopped
    # No published port: HUB_PORT belongs to the edge (app-hub-edge), which allows swapping the hub without downtime.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 60s
    environment:
      HUB_PLATFORM_DIR: /platform
      HUB_EDGE_CIDR: ${HUB_SUBNET:-10.231}.250.0/24 # the edge: the hub trusts the X-Forwarded-For headers it forwards
      HUB_APPS_FILE: /platform/config/apps.compose.json
      HUB_DB_URL: postgresql://hub:${APP_HUB_DB_PASSWORD:-hubpy-dev}@app-hub-db:5432/hub
      HUB_STATE_DB_URL: postgresql://hub:${APP_HUB_DB_PASSWORD:-hubpy-dev}@app-hub-db:5432/hub
      HUB_DATA_DIR: /data
      HUB_CONTAINER_SOCKET: /var/run/docker.sock
      # Containers of this instance (the hub only operates those with its prefix; default app-hub-app-*).
      HUB_CONTAINER_PREFIX: ${HUB_PROJECT:-app-hub}-app-
      HUB_BACKUP_DB_CONTAINER: ${HUB_PROJECT:-app-hub}-app-db
      HUB_APP_NETWORK: ${HUB_PROJECT:-app-hub}_default
      HUB_APP_ENV_FILE: /config/app-env.json # Python stack values (app-hub-app-db, app-hub-objstore); the loader only creates what is missing
      # Storage broker (Administração › Conexões): its own port, only /_hub/storage/*, reached by the
      # apps on the hub-app-<id> network (not published); each token is only valid from its app's network.
      HUB_BROKER_ADDR: 0.0.0.0:8081
      HUB_BROKER_PUBLIC_URL: http://app-hub-web:8081
      HUB_BROKER_APP_CIDRS: "ativos=${HUB_SUBNET:-10.231}.1.0/24,fornecedores=${HUB_SUBNET:-10.231}.2.0/24,servicos=${HUB_SUBNET:-10.231}.3.0/24,coletor=${HUB_SUBNET:-10.231}.5.0/24"
      # Platform object store (MinIO) for «Provisionar armazenamento».
      HUB_S3_ADMIN_URL: http://hubadmin:${APP_HUB_OBJSTORE_PASSWORD:-hubpy-objstore-dev}@app-hub-objstore:9000
    # No --reload: the published hub does not restart when code on disk changes (reload only in dev mode).
    command: ["uvicorn", "hub.main:app", "--host", "0.0.0.0", "--port", "8090"]
    env_file:
      - path: ./.dev.env
        required: false
    volumes:
      - app-hub-data:/data
      - ./app-env.json:/config/app-env.json:ro
      # Daemon socket (approved by the owner): the hub only operates `app-hub-*` containers
      # (guard in hub/ops/runtime.py); never hub-*, apphub-devtunnel or containers from outside the project.
      # Rootless Podman: HUB_CONTAINER_SOCKET_HOST=$XDG_RUNTIME_DIR/podman/podman.sock (install.sh detects it).
      - ${HUB_CONTAINER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
    # Linux: the socket is usually root:docker; export DOCKER_GID=$(stat -c %g /var/run/docker.sock).
    group_add: ["${DOCKER_GID:-0}"]
    depends_on: [app-hub-db, app-hub-objstore]
    networks:
      - default
      - edge
      - hub-app-ativos
      - hub-app-coletor
      - hub-app-fornecedores
      - hub-app-servicos

  app-hub-db:
    image: postgres:16-alpine
    container_name: ${HUB_PROJECT:-app-hub}-db
    labels: { hub.py: "1" }
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${APP_HUB_DB_PASSWORD:-hubpy-dev}
      POSTGRES_DB: hub
    volumes:
      - app-hub-db-data:/var/lib/postgresql/data

  # Lightweight MinIO (AGPL-3.0, built from the official source in infra/minio/Dockerfile; see NOTICE).
  app-hub-objstore:
    image: ${HUB_MINIO_IMAGE:-app-hub-minio:0.10.0}
    build:
      context: ./infra/minio
      target: minio
    container_name: ${HUB_PROJECT:-app-hub}-objstore
    labels: { hub.py: "1" }
    command: ["server", "/data"]
    mem_limit: 256m
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: hubadmin
      MINIO_ROOT_PASSWORD: ${APP_HUB_OBJSTORE_PASSWORD:-hubpy-objstore-dev}
      MINIO_BROWSER: "off"
    volumes:
      - app-hub-objstore-data:/data
    security_opt: [no-new-privileges]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10

  # Edge: owns HUB_PORT. Forwards to the hub and, during an update (scripts/hub-update.sh), also to the new copy.
  app-hub-edge:
    image: ${HUB_EDGE_IMAGE:-caddy:2.10.0-alpine}
    container_name: ${HUB_PROJECT:-app-hub}-edge
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8090}:8090"
      # localhost on IPv6; with HUB_BIND outside loopback, HUB_BIND6=$HUB_BIND (Podman already takes IPv6 on 0.0.0.0)
      - "${HUB_BIND6:-[::1]}:${HUB_PORT:-8090}:8090"
    volumes:
      - ./infra/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]

volumes:
  app-hub-db-data:
    name: ${HUB_PROJECT:-app-hub}-db-data
    labels: { hub.py: "1" }
  app-hub-data:
    name: ${HUB_PROJECT:-app-hub}-data
    labels: { hub.py: "1" }
  app-hub-objstore-data:
    name: ${HUB_PROJECT:-app-hub}-objstore-data
    labels: { hub.py: "1" }

# One network per app (the broker recognizes the app by its range = HUB_BROKER_APP_CIDRS). They exist even without the sample apps so that
# apps installed later can join them.
networks:
  edge:
    name: ${HUB_PROJECT:-app-hub}-edge
    driver: bridge
    ipam: { config: [{ subnet: "${HUB_SUBNET:-10.231}.250.0/24" }] }
  hub-app-ativos:
    name: ${HUB_PROJECT:-app-hub}-app-ativos
    driver: bridge
    ipam: { config: [{ subnet: "${HUB_SUBNET:-10.231}.1.0/24" }] }
  hub-app-fornecedores:
    name: ${HUB_PROJECT:-app-hub}-app-fornecedores
    driver: bridge
    ipam: { config: [{ subnet: "${HUB_SUBNET:-10.231}.2.0/24" }] }
  hub-app-servicos:
    name: ${HUB_PROJECT:-app-hub}-app-servicos
    driver: bridge
    ipam: { config: [{ subnet: "${HUB_SUBNET:-10.231}.3.0/24" }] }
  hub-app-coletor:
    name: ${HUB_PROJECT:-app-hub}-app-coletor
    driver: bridge
    ipam: { config: [{ subnet: "${HUB_SUBNET:-10.231}.5.0/24" }] }
