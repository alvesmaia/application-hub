# Overlay do modo de desenvolvimento (só via scripts/dev.sh; o hub recusa HUB_DEV_MODE=1 com config de produção).
# Código do disco com uvicorn --reload, assets sem cache, recarga ao vivo opcional (SSE /_dev/reload) e URL do túnel.
services:
  app-hub-web:
    volumes: # só no dev: código e assets do disco (a imagem de produção é selada, sem montagens de código)
      - ./hub:/app/hub:ro
      - ../platform:/platform:ro
    command: ["uvicorn", "hub.main:app", "--host", "0.0.0.0", "--port", "8090", "--reload", "--reload-dir", "/app/hub"]
    environment:
      HUB_DEV_MODE: "1"
      HUB_DEV_RELOAD: ${HUB_DEV_RELOAD:-0}
      HUB_DEV_WATCH: /platform/assets/shell,/platform/assets/web,/app/hub/web
      HUB_PUBLIC_URL: ${HUB_DEV_PUBLIC_URL:-http://localhost:8090}
      HUB_MCP_PUBLIC_NETWORK: "1"
    labels: { hub.dev: "1" }
