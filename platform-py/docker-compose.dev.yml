# Development-mode overlay (only via scripts/dev.sh; the hub refuses HUB_DEV_MODE=1 with production config).
# Code from disk with uvicorn --reload, uncached assets, optional live reload (SSE /_dev/reload) and tunnel URL.
services:
  app-hub-web:
    volumes: # dev only: code and assets from disk (the production image is sealed, with no code mounts)
      - ./hub:/app/hub:ro
      - ../platform:/platform:ro
    command: ["uvicorn", "hub.main:app", "--host", "0.0.0.0", "--port", "8090", "--reload", "--reload-dir", "/app/hub"]
    environment:
      HUB_DEV_MODE: "1"
      HUB_DEV_RELOAD: ${HUB_DEV_RELOAD:-0}
      HUB_DEV_WATCH: /platform/assets/shell,/platform/assets/web,/app/hub/web
      HUB_PUBLIC_URL: ${HUB_DEV_PUBLIC_URL:-http://localhost:8090}
      HUB_MCP_PUBLIC_NETWORK: "1"
    labels: { hub.dev: "1" }
