# OpenTelemetry Collector for the `observability` profile (optional; see platform/README.md).
# Receives OTLP/HTTP from hub-web (traces from the hub and the apps, collected by the hub; cumulative
# RED metrics), sends the traces to Jaeger and exposes the metrics in
# Prometheus format (:8889/metrics) for anyone who wants to scrape them. Memory limited (memory_limiter)
# to fit the target VM's budget.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 150
    spike_limit_mib: 30
  batch:
    timeout: 5s
exporters:
  otlp/jaeger:
    endpoint: app-hub-jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
