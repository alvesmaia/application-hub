# Local SQL connections for `hub dev` (copied to .hub/connections.toml on the first run; edit it there).
# On the hub, the connection with the same name comes from Administração › Conexões (bound to app × environment).
# url: sqlite:///.hub/<name>.db (created from dev/<name>.sql) or a real database with its driver in the project:
#   postgresql+psycopg://usuario:senha@localhost:5432/vendas
#   mysql+pymysql://usuario:senha@localhost:3306/vendas     (uv add pymysql)
#   mssql+pytds://usuario:senha@localhost:1433/vendas       (uv add sqlalchemy-pytds)

[connections.vendas]
url = "sqlite:///.hub/vendas.db"
readonly = true
max_rows = 5000
