<section class="panel ops-host" data-ops-host="/admin/runtime/host"><div class="panel-heading"><span class="ops-host-title"><h3>Capacidade do host</h3><span class="hub-info-toggle sm" tabindex="0" role="img" aria-label="{{ runtime_info }}" title="{{ runtime_info }}">i</span></span><span class="ops-muted">Uso atual · atualiza sozinho</span></div><div class="ops-caption">{{ cpu_title }}</div><div class="ops-stack">{% for style, cls, lbl in bars.cpu %}<span class="{{ cls }}" style="{{ style }}" title="{{ lbl }}"></span>{% endfor %}</div><div class="ops-caption">{{ mem_title }}</div><div class="ops-stack">{% for style, cls, lbl in bars.mem %}<span class="{{ cls }}" style="{{ style }}" title="{{ lbl }}"></span>{% endfor %}</div><div class="ops-legend"><span class="sys">Sistema</span><span class="plat">Plataforma</span><span class="apps">Aplicações</span><span class="free">{{ free_label }}</span></div></section>
