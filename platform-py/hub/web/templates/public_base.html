<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="auto" data-dev-public="">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light dark"/>
<title>{% block title %}{{ brand }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg"/>
<link rel="preload" href="/assets/fonts/nunito-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
<link rel="preload" href="/assets/fonts/red-hat-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
<link rel="stylesheet" href="/assets/tokens.css"/>
<link rel="stylesheet" href="/assets/theme.css"/>
<link rel="stylesheet" href="/assets/styles.css"/>
<link rel="stylesheet" href="/assets/hub.css"/>
<link rel="stylesheet" href="/assets/ops.css"/>
<link rel="stylesheet" href="/assets/devdocs.css"/>
<script src="/assets/devdocs.js"></script>
{% block head %}{% endblock %}
</head>
<body class="rail-hidden dev-public">
<a class="skip-link" href="#app-root">{{ t('shell.skip') }}</a>
<header class="platform-header"><a class="brand" href="/developers"><span class="brand-mark"><img src="/assets/logo.svg" alt=""/></span><span class="brand-text"><span class="brand-name" title="{{ brand }}">{{ brand }}</span><span class="brand-subtitle">{{ tr('Desenvolvedores') }}</span></span></a>
<div class="header-actions"><button type="button" class="dev-theme" data-dev-theme="" aria-label="{{ t('shell.theme') }}" title="{{ t('shell.theme') }}"><svg class="dev-theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="dev-theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button><a class="secondary-button" href="/login?next={{ path|urlencode }}">{{ tr('Entrar') }}</a></div></header>
<main id="app-root" class="app-root" tabindex="-1">
{% block main %}{% endblock %}
</main>
</body>
</html>
