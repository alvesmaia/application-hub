{% if pending_apps %}<section class="panel ops-section" aria-labelledby="apply-h"><div class="panel-heading"><h3 id="apply-h">{{ tr('Aplicações com reinício pendente') }}</h3></div><ul class="hub-list">{% for id, name, n in pending_apps %}<li><span><strong>{{ name }}</strong> <small class="ops-muted">{{ n }} {{ tr('variáveis alteradas') }}</small></span><button type="button" data-requires="editar_configuracoes" class="primary-button" data-ops-apply="{{ id }}">{{ tr('Aplicar (reiniciar)') }}</button></li>{% endfor %}</ul></section>{% endif %}
