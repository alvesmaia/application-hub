# Apps database + the 4 sample apps (ativos, fornecedores, servicos, coletor).
# The apps only start with the `demo-apps` profile (COMPOSE_PROFILES=demo-apps or --profile demo-apps); without it the hub and the
# apps database start on their own (use HUB_APPS_JSON=./apps.empty.json for an empty catalog).
# Host debug ports (HUB_APPDB_PORT, HUB_APP_PORT_<APP>) bound to 127.0.0.1 only.
services:
  app-hub-web:
    environment:
      HUB_APPS_FILE: /config/apps.json
    volumes:
      - ${HUB_APPS_JSON:-./apps.json}:/config/apps.json:ro
    depends_on:
      app-hub-app-db: { condition: service_started }
      app-hub-app-ativos: { condition: service_started, required: false }
      app-hub-app-fornecedores: { condition: service_started, required: false }
      app-hub-app-servicos: { condition: service_started, required: false }
      app-hub-app-coletor: { condition: service_started, required: false }

  app-hub-app-db:
    image: ${HUB_IMAGE_PREFIX:-}postgres:16-alpine
    container_name: ${HUB_PROJECT:-app-hub}-app-db
    mem_limit: 1g # = resources.memory in the manifests and the `app` service of the previous compose version; 256m caused OOM on the 200k-row import
    restart: unless-stopped
    # the apps' roles are not superusers: when they take every normal slot, the hub (superuser `hub`) still connects
    command: ["postgres", "-c", "max_connections=200", "-c", "superuser_reserved_connections=30"]
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${APP_HUB_APP_DB_PASSWORD:-hubpy-app-dev}
      POSTGRES_DB: hub
    ports:
      - "127.0.0.1:${HUB_APPDB_PORT:-15433}:5432"
    volumes:
      - ${HUB_APPDB_DIR:-app-hub-app-db-data}:/var/lib/postgresql/data${HUB_BIND_OPTS:-}
      - ./infra/app-db-init.sh:/docker-entrypoint-initdb.d/10-app-dbs.sh:ro
    labels: { hub.py: "1" }

  app-hub-app-ativos:
    image: ${HUB_PROJECT:-app-hub}-ativos
    profiles: [demo-apps]
    build:
      context: ../platform
      dockerfile: demo-apps-py/ativos/Dockerfile
      # network settings for the build, from the environment (scripts/install.sh); an unset one is not passed
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        - EXTRA_CA_PEM
        - IMAGE_PREFIX
        - PIP_INDEX_URL
    container_name: ${HUB_PROJECT:-app-hub}-app-ativos
    mem_limit: 1g # = resources.memory in the manifests and the `app` service of the previous compose version; 256m caused OOM on the 200k-row import
    restart: unless-stopped
    environment: &app-hub-app-env
      HUB_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:-hubpy-app-dev}@app-hub-app-db:5432/ativos # one database per app (ativos); the others override it
      HUB_DEMO_E2E_HOSTILE: "1" # tests only: routes for the anti-phishing E2E (ativos/servicos); the production compose never enables it
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_ATIVOS:-hubpy-${APP_HUB_APP_TOKEN:-local}-ativos}
    depends_on: [app-hub-app-db]
    ports: ["127.0.0.1:${HUB_APP_PORT_ATIVOS:-9101}:8080"]
    networks: [default, hub-app-ativos]
    labels: { hub.py: "1" }

  app-hub-app-fornecedores:
    image: ${HUB_PROJECT:-app-hub}-fornecedores
    profiles: [demo-apps]
    build:
      context: ../platform
      dockerfile: demo-apps-py/fornecedores/Dockerfile
      # network settings for the build, from the environment (scripts/install.sh); an unset one is not passed
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        - EXTRA_CA_PEM
        - IMAGE_PREFIX
        - PIP_INDEX_URL
    container_name: ${HUB_PROJECT:-app-hub}-app-fornecedores
    mem_limit: 1g # = resources.memory in the manifests and the `app` service of the previous compose version; 256m caused OOM on the 200k-row import
    restart: unless-stopped
    environment:
      <<: *app-hub-app-env
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_FORNECEDORES:-hubpy-${APP_HUB_APP_TOKEN:-local}-fornecedores}
      HUB_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:-hubpy-app-dev}@app-hub-app-db:5432/fornecedores # one database per app
      HUB_S3_ENDPOINT_FORNECEDORES: http://app-hub-objstore:9000
      HUB_S3_BUCKET_FORNECEDORES: fornecedores
      HUB_S3_ACCESS_KEY_FORNECEDORES: hubadmin
      HUB_S3_SECRET_KEY_FORNECEDORES: ${APP_HUB_OBJSTORE_PASSWORD:-hubpy-objstore-dev}
    depends_on: [app-hub-app-db, app-hub-objstore]
    ports: ["127.0.0.1:${HUB_APP_PORT_FORNECEDORES:-9102}:8080"]
    networks: [default, hub-app-fornecedores]
    labels: { hub.py: "1" }

  app-hub-app-servicos:
    image: ${HUB_PROJECT:-app-hub}-servicos
    profiles: [demo-apps]
    build:
      context: ../platform
      dockerfile: demo-apps-py/servicos/Dockerfile
      # network settings for the build, from the environment (scripts/install.sh); an unset one is not passed
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        - EXTRA_CA_PEM
        - IMAGE_PREFIX
        - PIP_INDEX_URL
    container_name: ${HUB_PROJECT:-app-hub}-app-servicos
    mem_limit: 1g # = resources.memory in the manifests and the `app` service of the previous compose version; 256m caused OOM on the 200k-row import
    restart: unless-stopped
    environment:
      <<: *app-hub-app-env
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_SERVICOS:-hubpy-${APP_HUB_APP_TOKEN:-local}-servicos}
      HUB_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:-hubpy-app-dev}@app-hub-app-db:5432/servicos # one database per app
    depends_on: [app-hub-app-db]
    ports: ["127.0.0.1:${HUB_APP_PORT_SERVICOS:-9103}:8080"]
    networks: [default, hub-app-servicos]
    labels: { hub.py: "1" }

  app-hub-app-coletor:
    image: ${HUB_PROJECT:-app-hub}-coletor
    profiles: [demo-apps]
    build:
      context: ../platform
      dockerfile: Dockerfile.coletor
      # network settings for the build, from the environment (scripts/install.sh); an unset one is not passed
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
        - EXTRA_CA_PEM
        - IMAGE_PREFIX
        - PIP_INDEX_URL
    container_name: ${HUB_PROJECT:-app-hub}-app-coletor
    mem_limit: 1g # = resources.memory in the manifests and the `app` service of the previous compose version; 256m caused OOM on the 200k-row import
    restart: unless-stopped
    environment:
      <<: *app-hub-app-env
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_COLETOR:-hubpy-${APP_HUB_APP_TOKEN:-local}-coletor}
      HUB_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:-hubpy-app-dev}@app-hub-app-db:5432/coletor # one database per app
    depends_on: [app-hub-app-db]
    ports: ["127.0.0.1:${HUB_APP_PORT_COLETOR:-9105}:8080"]
    networks: [default, hub-app-coletor]
    labels: { hub.py: "1" }

volumes:
  app-hub-app-db-data:
    name: ${HUB_PROJECT:-app-hub}-app-db-data
    labels: { hub.py: "1" }
