# PRODUCTION overlay - always use with --env-file .prod.env (gitignored; template in prod.env.example):
#   docker compose --env-file .prod.env -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.prod.yml up -d
# No demo accounts (HUB_DEMO_USERS does not exist), no app test routes, required variables
# (compose refuses to start if one is missing), Secure cookie and variable seeding without the test variable.
# Compose >= 2.24 (!override / !reset).
services:
  app-hub-web:
    env_file: !override
      - path: ./.prod.env
        required: true
    environment:
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?https://hub.exemplo.com.br}
      HUB_PUBLIC_DOCS: ${HUB_PUBLIC_DOCS:-1}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-1} # install.sh writes auto for an http:// URL (tests only)
      HUB_MASTER_KEY_FILE: ${HUB_MASTER_KEY_FILE:-/data/master.key} # fails to start if the file is missing (never silently generates a new key)
      HUB_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:?}@app-hub-app-db:5432/hub
      HUB_STATE_DB_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:?}@app-hub-app-db:5432/hub
      HUB_S3_ADMIN_URL: http://hubadmin:${APP_HUB_OBJSTORE_PASSWORD:?}@app-hub-objstore:9000
      HUB_APP_ENV_FILE: /config/app-env.prod.json
      # External audit anchor (F19): signed head kept outside the data volume (another disk/NFS in production).
      HUB_AUDIT_HEAD_FILE: /audit-head/head.jsonl
      HUB_BUILD_CPUS: ${HUB_BUILD_CPUS:-2}
      HUB_BUILD_TIMEOUT_S: ${HUB_BUILD_TIMEOUT_S:-900}
      HUB_KEEP_IMAGES: ${HUB_KEEP_IMAGES:-3}
    volumes:
      - ./app-env.prod.json:/config/app-env.prod.json:ro
      - ${HUB_AUDIT_HEAD_DIR:?defina HUB_AUDIT_HEAD_DIR (pasta fora do volume de dados)}:/audit-head

  app-hub-objstore:
    environment:
      MINIO_ROOT_PASSWORD: ${APP_HUB_OBJSTORE_PASSWORD:?}

  app-hub-app-db:
    environment:
      POSTGRES_PASSWORD: ${APP_HUB_APP_DB_PASSWORD:?}

  app-hub-db-roles:
    environment:
      HUB_APPDB_ADMIN_URL: postgresql://hub:${APP_HUB_APP_DB_PASSWORD:?}@app-hub-app-db:5432/postgres
      APP_HUB_APP_DB_PASSWORD_ATIVOS: ${APP_HUB_APP_DB_PASSWORD_ATIVOS:?}
      APP_HUB_APP_DB_PASSWORD_FORNECEDORES: ${APP_HUB_APP_DB_PASSWORD_FORNECEDORES:?}
      APP_HUB_APP_DB_PASSWORD_SERVICOS: ${APP_HUB_APP_DB_PASSWORD_SERVICOS:?}
      APP_HUB_APP_DB_PASSWORD_COLETOR: ${APP_HUB_APP_DB_PASSWORD_COLETOR:?}

  app-hub-app-ativos:
    environment: &prod-app
      HUB_DEMO_E2E_HOSTILE: "0"
      HUB_DB_URL: postgresql://ativos:${APP_HUB_APP_DB_PASSWORD_ATIVOS:?}@app-hub-app-db:5432/ativos
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_ATIVOS:?}

  app-hub-app-fornecedores:
    environment:
      <<: *prod-app
      HUB_DB_URL: postgresql://fornecedores:${APP_HUB_APP_DB_PASSWORD_FORNECEDORES:?}@app-hub-app-db:5432/fornecedores
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_FORNECEDORES:?}
      HUB_S3_SECRET_KEY_FORNECEDORES: ${APP_HUB_OBJSTORE_PASSWORD:?}

  app-hub-app-servicos:
    environment:
      <<: *prod-app
      HUB_DB_URL: postgresql://servicos:${APP_HUB_APP_DB_PASSWORD_SERVICOS:?}@app-hub-app-db:5432/servicos
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_SERVICOS:?}

  app-hub-app-coletor:
    environment:
      <<: *prod-app
      HUB_DB_URL: postgresql://coletor:${APP_HUB_APP_DB_PASSWORD_COLETOR:?}@app-hub-app-db:5432/coletor
      HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN_COLETOR:?}
