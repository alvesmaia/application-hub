# "Live" mode for the owner's instance: the production config (.prod.env + docker-compose.prod.yml)
# with code, templates, assets and docs read from disk and automatic reload. No HUB_DEV_MODE (it does not reload
# demo accounts nor expose /_dev). Usage:
#   docker compose --env-file .prod.env -f docker-compose.yml -f docker-compose.apps.yml \
#     -f docker-compose.prod.yml -f docker-compose.live.yml up -d --no-deps app-hub-web
# To go back to the sealed image: the same command without `-f docker-compose.live.yml`.
services:
  app-hub-web:
    command: ["uvicorn", "hub.main:app", "--host", "0.0.0.0", "--port", "8090", "--reload", "--reload-dir", "/app/hub"]
    volumes:
      - ./hub:/app/hub:ro
      - ../platform/assets/shell:/platform/assets/shell:ro
      - ../platform/assets/web:/platform/assets/web:ro
      - ../platform/assets/i18n:/platform/assets/i18n:ro
      - ../platform/docs/dev:/platform/docs/dev:ro
      - ../platform/docs/CONTRATO-APP.md:/platform/docs/CONTRATO-APP.md:ro
    labels: { hub.live: "1" }
