# OpenAPI linter (ci-local, openapi-lint step). Redocly "recommended" base;
# the exceptions below are project decisions, not oversights.
extends:
  - recommended
rules:
  info-license: off            # internal API, no public license
  no-server-example.com: error
  operation-4xx-response: error
  operation-operationId-unique: error
  operation-summary: error
  no-unused-components: warn
  security-defined: error
