{#- Workspace do app (mesmo DOM dos fragmentos do mockup: sidebar + conteúdo) — o
    shell do hub (styles.css/hub.css) e o demo.css estilizam estas classes. Extenda e
    preencha o bloco `content`. Sem <script> inline (CSP do hub). Textos via t() (onda 9). -#}
<div class="workspace {{ app.id }}-workspace" id="workspace"><aside class="app-sidebar" aria-label="{{ t('Navegação da aplicação') }}"><div class="sidebar-app"><div class="sidebar-app-row"><span class="app-icon" style="background:{{ app.color }};color:{{ app.ink }}">{{ icon(app.icon) }}</span><span><strong title="{{ t(app.name) }}">{{ t(app.name) }}</strong>{% if app.tagline %}<small>{{ t(app.tagline) }}</small>{% endif %}</span></div></div><div class="sidebar-caption">{{ t('Navegação') }}</div><nav class="sidebar-nav" aria-label="{{ t('Navegação da aplicação') }}">{% for item in app.nav %}<a class="nav-item {{ 'active' if item.section == active else '' }}" href="{{ base }}/{{ item.section }}"{{ ' aria-current="page"'|safe if item.section == active else '' }}>{{ icon(item.icon) }}<span>{{ t(item.label) }}</span></a>{% endfor %}</nav><div class="sidebar-bottom"><div class="hub-user-note">{{ t('Conectado como') }} <strong>{{ user }}</strong></div><div class="help-card"><strong>{{ t('Precisa de ajuda?') }}</strong><p>{{ t('Consulte a documentação ou fale com o time de suporte.') }}</p><button type="button" data-toast="{{ t('O suporte entrará em contato em breve.') }}">{{ t('Acessar central de ajuda →') }}</button></div><a class="back-link" href="/applications">{{ icon('back') }}<span>{{ t('Voltar à plataforma') }}</span></a></div></aside><div class="mobile-backdrop" data-hub-menu="close"></div><section class="workspace-content {{ app.id }}-content"><button type="button" class="mobile-menu-button" data-hub-menu="open">{{ icon('menu') }} {{ t('Menu da aplicação') }}</button>{% block content %}{% endblock %}</section></div>
