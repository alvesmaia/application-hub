[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-sdk"
version = "0.2.0"
license = "Apache-2.0"
description = "SDK Python (FastAPI) dos apps da Application Hub: identidade, fragmentos, tarefas duráveis, idempotência, outbox, /_hub/*, desligamento gracioso e operações pesadas."
requires-python = ">=3.11"
# Dependências mínimas e fixadas (mesmas versões nos apps, no CI e nas imagens).
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "asyncpg==0.31.0",
  "jinja2==3.1.6",
  "typing-extensions==4.16.0",
]

[project.optional-dependencies]
# Camada SQL portátil (hub_sdk.db.engine/upgrade): SQLite no hub dev, Postgres no hub.
sql = ["sqlalchemy==2.0.44", "alembic==1.17.1", "psycopg[binary]==3.2.12"]
# Kit de dashboards (hub_sdk.dashboards): SQL local no dev + exportação XLSX.
dashboards = ["sqlalchemy==2.0.44", "openpyxl==3.1.5"]
dev = [
  "openpyxl==3.1.5",
  "sqlalchemy==2.0.44",
  "alembic==1.17.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.9",
  "ty",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "openapi-spec-validator==0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hub_sdk = ["templates/*.html", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: precisa de Postgres (HUB_DB_TEST_URL)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.11"
