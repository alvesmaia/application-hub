# Application Hub configuration (wave 11) — copy to config/hub.toml or point
# HUB_CONFIG_FILE at the file. All values below are the DEFAULTS: an empty file
# (or no file) gives exactly this behavior.
#
# Environment variables override the file:
#   HUB_API_ENABLED, HUB_API_DOCS_ENABLED, HUB_API_RATE_PER_MIN,
#   HUB_MCP_ENABLED, HUB_MCP_PATH, HUB_MCP_TRANSPORTS (ex.: "http,stdio"),
#   HUB_MCP_DESTRUCTIVE_ACTIONS (confirm|deny), HUB_MCP_EXPOSE_APP_TOOLS,
#   HUB_MCP_CALLS_PER_MIN, HUB_MCP_TOOL_TIMEOUT_S, HUB_MCP_MAX_RESULT_KB,
#   HUB_MCP_CONFIRM_TTL_S, HUB_APPS_ALLOW_WITHOUT_API
# Unknown key, wrong type or out-of-range value => the hub does NOT start (clear error).

[api]
# Versioned public surface /api/v1 (+ /api/v1/openapi.json and /api/docs).
# The web UI uses the internal /api/* routes and always keeps working:
# enabled = false only makes /api/v1, the OpenAPI and the docs return 404.
enabled = true
# Requests per minute per user — all tokens of the same owner (and the session)
# share the quota; a CI token (no owner) has its own (429 + Retry-After above that).
rate_per_min = 600
# Pagination: default and maximum ?limit= size.
page_size = 50
max_page_size = 500

[api.docs]
# /api/docs page (login required) and the OpenAPI 3.1 document.
enabled = true

[mcp]
# Hub MCP (Model Context Protocol) server for AI clients; only accepts
# Authorization: Bearer (token with the mcp scope). The HUB tools are the same
# surface as /api/v1: with [api].enabled = false they disappear (only the apps' ones remain,
# if expose_app_tools).
enabled = true
# "http" = Streamable HTTP at `path`; "stdio" = the CLI's `hub mcp` (a proxy that talks
# to the hub over HTTP; requires "http").
transports = ["http", "stdio"]
path = "/mcp"
# Tools that change/remove something (deploy, rollback, backup, cancel task and
# ALL POST/PUT/PATCH/DELETE mutations of the apps, unless mcp.confirm_exempt in the manifest):
#   "confirm" = (default) the 1st call returns a confirm_token and the 2nd, with it, executes.
#               WARNING: depends on the AI client's confirmation (e.g. Claude Code asks
#               before each tool) — the model itself can resend the token;
#   "deny"    = these tools do not appear at all.
destructive_actions = "confirm"
# Aggregates the apps' MCP tools as <app>.<tool> (called by the hub, on the
# user's behalf, over the internal network — the apps are never reached directly).
expose_app_tools = true
# Wave 12: /mcp, /.well-known/* and /oauth/* outside HUB_ADMIN_ALLOWED_CIDRS (AI client
# in the cloud, e.g. Langdock SaaS, reaches the hub over the internet). /api and /admin remain
# restricted. Env: HUB_MCP_PUBLIC_NETWORK.
public_network = false

[mcp.limits]
calls_per_min = 120      # tool calls per minute per user (tokens of the same owner share it)
tool_timeout_s = 30      # maximum time of a tool call
max_result_kb = 256      # larger results are truncated
logs_tail_max = 200      # maximum lines of logs_tail
confirm_ttl_s = 300      # confirm_token lifetime
max_request_kb = 256     # maximum body of a JSON-RPC message

[mcp.oauth]
# The hub as an OAuth 2.1 authorization server (PKCE S256 required) and resource server
# for /mcp, for remote MCP clients (e.g. Langdock). Discovery:
# /.well-known/oauth-protected-resource/mcp e /.well-known/oauth-authorization-server.
# The public address (issuer and "resource") comes from HUB_PUBLIC_URL — set it in production.
# Personal tokens (Authorization: Bearer hubt_…) remain valid on /mcp.
enabled = true
# Dynamic client registration (POST /oauth/register, RFC 7591) — Langdock uses it.
dynamic_registration = true
# client_id = HTTPS URL of a Client ID Metadata Document (fetched by the hub; only
# public addresses).
client_metadata_documents = true
# Hosts accepted in redirect_uri (empty = any HTTPS host; localhost/127.0.0.1
# always accepted, with http). E.g.: ["app.langdock.com"]. Env: HUB_MCP_OAUTH_ALLOWED_REDIRECT_HOSTS.
allowed_redirect_hosts = []
# Scopes an OAuth client may receive (the token acts as the user, with the same
# UI permissions; these scopes only restrict): "mcp" = read tools;
# "api:write" = tools that change something. Removing "api:write" = agents are read-only.
allowed_scopes = ["mcp", "api:write"]
access_token_ttl_s = 3600    # access token (bound to resource = <HUB_PUBLIC_URL>/mcp)
refresh_token_ttl_days = 30  # refresh token (rotated on each use; reuse revokes the grant)
code_ttl_s = 120             # authorization code (single use)

[apps]
# Rule: every app exposes an API (manifest api.enabled = true, default). true accepts
# packages with api.enabled = false (documented exception; the pipeline warns).
allow_without_api = false
