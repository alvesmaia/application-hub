# OpenTelemetry Collector do perfil `observability` (opcional; ver platform/README.md).
# Recebe OTLP/HTTP do hub-web (traces do hub e dos apps, coletados pelo hub; métricas
# RED cumulativas), manda os traces ao Jaeger e expõe as métricas em formato
# Prometheus (:8889/metrics) para quem quiser raspar. Memória limitada (memory_limiter)
# para caber no orçamento da VM de destino.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 150
    spike_limit_mib: 30
  batch:
    timeout: 5s
exporters:
  otlp/jaeger:
    endpoint: hub-jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
