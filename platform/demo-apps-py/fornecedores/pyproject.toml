[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fornecedores"
version = "1.9.0"
license = "Apache-2.0"
description = "Rede de Fornecedores — app de demonstração em Python/FastAPI (hub-sdk-python)."
requires-python = ">=3.11"
# Fixadas: mesmas versões na imagem, no CI e no hub dev.
dependencies = [
  "hub-sdk==0.2.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov",
  "httpx==0.28.1",
  "ruff==0.16.9",
  "ty",
]

[project.scripts]
fornecedores = "fornecedores.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fornecedores = ["fragments/*", "assets/*", "i18n.json", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: precisa de Postgres (HUB_DB_TEST_URL)"]

[tool.coverage.run]
source = ["fornecedores"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.12"

[tool.coverage.report]
fail_under = 80
