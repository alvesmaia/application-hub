{#- Controles da sessão (os mesmos no computador e no celular). `tela` e `target` vêm de quem inclui. -#}
<div class="col-session-actions" role="group" aria-label="{{ t('Controles da sessão') }}">
<form method="post" action="{{ base }}/sessao/proximo" data-hub-target="{{ target }}"><input type="hidden" name="tela" value="{{ tela }}"><button type="submit" class="col-button col-button-dark" data-col-action="proximo">{{ t('Próximo') }}</button></form>
{% if sess.status == 'paused' %}<form method="post" action="{{ base }}/sessao/continuar" data-hub-target="{{ target }}"><input type="hidden" name="tela" value="{{ tela }}"><button type="submit" class="col-button col-button-primary" data-col-action="continuar">{{ t('Continuar') }}</button></form>
{% else %}<form method="post" action="{{ base }}/sessao/parar" data-hub-target="{{ target }}"><input type="hidden" name="tela" value="{{ tela }}"><button type="submit" class="col-button col-button-ghost" data-col-action="parar">{{ t('Parar') }}</button></form>{% endif %}
<form method="post" action="{{ base }}/sessao/reiniciar" data-hub-target="{{ target }}"><input type="hidden" name="tela" value="{{ tela }}"><button type="submit" class="col-button col-button-ghost" data-col-action="reiniciar" data-hub-confirm="{{ t('Reiniciar a sessão? Os códigos são sorteados em nova ordem e os resultados atuais são apagados.') }}">{{ t('Reiniciar') }}</button></form>
<form method="post" action="{{ base }}/sessao/cancelar" data-hub-target="{{ target }}"><input type="hidden" name="tela" value="{{ tela }}"><button type="submit" class="col-button col-button-ghost" data-col-action="cancelar">{{ t('Cancelar') }}</button></form>
</div>
