[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coletor"
version = "1.0.0"
license = "Apache-2.0"
description = "Coletor — demo app in Python/FastAPI (hub-sdk-python): inventory, receiving and lookup with a barcode reader."
requires-python = ">=3.11"
# Pinned: same versions in the image, in CI and in the hub dev.
dependencies = [
  "hub-sdk==0.2.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "python-barcode==0.16.1",
  "segno==1.6.6",
  "ppf-datamatrix==0.2",
  "wsproto==1.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.9",
  "ty",
]

[project.scripts]
coletor = "coletor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coletor = ["templates/*.html", "assets/*", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: precisa de Postgres (HUB_DB_TEST_URL)"]

[tool.coverage.run]
source = ["coletor"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.11"
